name: Checks
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
# TODO: Remove below env once stable release of starknet foundry is available
  SNFOUNDRY_SHA: 3d227d0aa6bf896f912144088f3c7bf0424f4c13

jobs:
  test:
    strategy:
      matrix:
        os: [
          "macos-latest",
          "ubuntu-latest"
        ]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3
        with:
          cmake-version: '3.18.1'

      # TODO(#539)
      - name: Fetch latest asdf version from GitHub releases
        id: asdf_version
        run: |
          latest_version=$(curl -sS --fail -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/asdf-vm/asdf/releases/latest | grep \"tag_name\": | awk '{print $2}' | tr -d 'v",')
          echo "Latest asdf version found is $latest_version"
          echo "LATEST=$latest_version" >> $GITHUB_ENV

      - name: Setup asdf
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ASDF_PLATFORM="linux-amd64"
          else
            ASDF_PLATFORM="darwin-arm64"
          fi
          mkdir -p "$HOME/.local/bin"
          DOWNLOAD_URL="https://github.com/asdf-vm/asdf/releases/download/v${LATEST}/asdf-v${LATEST}-${ASDF_PLATFORM}.tar.gz"
          echo "Downloading asdf from $DOWNLOAD_URL"
          curl -fsSL "$DOWNLOAD_URL" | tar xzf - -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "${ASDF_DATA_DIR:-$HOME/.asdf}/shims" >> $GITHUB_PATH

      - name: Install starknet-devnet
        run: |
          asdf plugin add starknet-devnet
          asdf install starknet-devnet 0.8.0-rc.0
          asdf set starknet-devnet 0.8.0-rc.0 --home

      - name: Install starknet-foundry
        run: |
           asdf plugin add starknet-foundry
           asdf install starknet-foundry nightly-2025-12-02
           asdf set starknet-foundry nightly-2025-12-02 --home

      - name: Install scarb
        run: |
          asdf plugin add scarb
          asdf install scarb 0.4.0
          asdf install scarb 0.7.0
          asdf install scarb 2.6.0

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          cache-read-only: false

      - name: Run tests and generate coverage report
        env:
          NETWORK_TEST_MODE: "all"
          NETWORK_TEST_NETWORK_NAME: "SEPOLIA_TESTNET"
          SEPOLIA_TESTNET_RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
          SEPOLIA_TESTNET_ACCOUNT_ADDRESS: ${{ secrets.TESTNET_ACCOUNT_ADDRESS }}
          SEPOLIA_TESTNET_PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
          SEPOLIA_TESTNET_ACCOUNT_CAIRO_VERSION: ${{ secrets.TESTNET_ACCOUNT_CAIRO_VERSION }}
        run: ./gradlew :lib:koverXmlReport --info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: lib/build/reports/kover/report.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3
        with:
          cmake-version: '3.18.1'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          cache-read-only: false

      - name: Lint
        run: ./gradlew :lib:lintKotlin

  check-guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3
        with:
          cmake-version: '3.18.1'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          cache-read-only: false

      - name: Check guides
        run: |
          ./gradlew :lib:generateGuides
          if ! git diff --exit-code lib/*.md; then
            echo "Error: Guides are not up-to-date. Please run './gradlew :lib:generateGuides' and commit the changes."

            exit 1
          else
            echo "Guides are up-to-date"
          fi
