plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    compileSdk 37
    ndkVersion "23.1.7779620"
    namespace "com.swmansion.starknet"

    defaultConfig {
        minSdk 24
        targetSdk 33

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                targets "crypto_jni", "poseidon_jni"
                arguments "-DCMAKE_BUILD_TYPE=Release", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }

    }

    lint {
        baseline(file("lint-baseline.xml"))
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "../crypto/CMakeLists.txt"
            version "3.18.1"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            kotlin.srcDirs = ['../lib/src/main']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("1.8")
    }
}

dependencies {
    testImplementation libs.junit4
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation libs.bcprov.jdk18on
    implementation libs.okhttp
    implementation libs.kotlinx.serialization.json
    implementation libs.kotlin.reflect
    implementation libs.java.semver
}
